<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NanoGPT Interactive Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">
  <div class="w-full max-w-3xl bg-slate-800 rounded-xl shadow-lg border border-slate-700 p-6 space-y-6">
    <div class="border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold tracking-tight text-white">NanoGPT Aligned Inference Console</h1>
      <p class="text-sm text-slate-400 mt-1">Direct Preference Optimization (DPO) Shakespearean Language Model</p>
    </div>

    <!-- Input Configuration -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Prompt Context</label>
        <textarea id="promptInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. &#10;ROMEO:&#10;What light ">
ROMEO:
What light </textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase">Max New Tokens</label>
          <input id="maxTokensInput" type="number" value="60" min="10" max="300" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm mt-1 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase">Temperature: <span id="tempVal">0.7</span></label>
          <input id="tempInput" type="range" min="0.1" max="1.5" step="0.05" value="0.7" class="w-full mt-2 accent-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase">Top-K</label>
          <input id="topKInput" type="number" value="5" min="1" max="50" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm mt-1 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
      </div>

      <button id="generateBtn" onclick="runInference()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition duration-200 flex items-center justify-center space-x-2">
        <span id="btnText">Generate Continuation</span>
      </button>
    </div>

    <!-- Output Display -->
    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Generated Output</label>
      <pre id="outputArea" class="w-full min-h-[140px] bg-slate-950 border border-slate-700 rounded-lg p-4 font-mono text-sm text-emerald-400 whitespace-pre-wrap overflow-x-auto">Waiting for generation...</pre>
    </div>
  </div>

  <script>
    const tempInput = document.getElementById('tempInput');
    const tempVal = document.getElementById('tempVal');
    tempInput.addEventListener('input', (e) => { tempVal.textContent = e.target.value; });

    async function runInference() {
      const btn = document.getElementById('generateBtn');
      const btnText = document.getElementById('btnText');
      const outputArea = document.getElementById('outputArea');
      
      const prompt = document.getElementById('promptInput').value;
      const max_new_tokens = parseInt(document.getElementById('maxTokensInput').value, 10);
      const temperature = parseFloat(tempInput.value);
      const top_k = parseInt(document.getElementById('topKInput').value, 10);

      btn.disabled = true;
      btnText.textContent = "Sampling tokens...";
      outputArea.textContent = "Processing forward passes...";

      try {
        const response = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, max_new_tokens, temperature, top_k })
        });

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        const data = await response.json();
        outputArea.textContent = data.generated_text;
      } catch (err) {
        outputArea.textContent = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
        btnText.textContent = "Generate Continuation";
      }
    }
  </script>
</body>
</html>
